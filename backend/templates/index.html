<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>ResumeIQ AI</title>

    <link rel="stylesheet" href="/static/style.css">

</head>

<body>

    <div class="container">

        <div class="header">

            <h1>ResumeIQ AI</h1>

            <p>
                AI Powered Resume Analyzer
            </p>

        </div>

        <div class="uploadBox">

            <h2>Upload Resume</h2>

            <input
                type="file"
                id="resume"
                accept=".pdf">

            <textarea
                id="jobDescription"
                placeholder="Enter Job Description (Optional)"></textarea>

            <button
                id="analyzeBtn">

                Analyze Resume

            </button>

        </div>

        <div
            id="loading">

            <div class="loader"></div>

            <p>Analyzing Resume...</p>

        </div>

        <div
            id="result">

            <div class="scoreCard">

                <h2>ATS SCORE</h2>

                <h1 id="atsScore">
                    --
                </h1>

            </div>

            <div class="card">

                <h3>Professional Summary</h3>

                <p id="summary"></p>

            </div>

            <div class="card">

                <h3>Strengths</h3>

                <p id="strengths"></p>

            </div>

            <div class="card">

                <h3>Weaknesses</h3>

                <p id="weaknesses"></p>

            </div>

            <div class="card">

                <h3>Missing Skills</h3>

                <p id="missingSkills"></p>

            </div>

            <div class="card">

                <h3>Best Job Roles</h3>

                <p id="jobRoles"></p>

            </div>

            <div class="card">

                <h3>Resume Improvement Tips</h3>

                <p id="tips"></p>

            </div>

            <div class="card">

                <h3>Final Verdict</h3>

                <p id="verdict"></p>

            </div>

        </div>

    </div>

<script src="/static/script.js"></script>

</body>

</html>
